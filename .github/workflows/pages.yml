name: Publish research explorer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'deploy/**', 'tests/**', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test raster reader
        run: node tests/chunked-raster.cjs
      - name: Install lossless raster packaging dependencies
        run: python3 -m pip install numpy==2.4.2 rasterio==1.4.4 pillow==12.1.0
      - name: Download verified 2000 dataset and site assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/site-data"
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern site-2000.zip --dir "$RUNNER_TEMP/site-data"
          python3 deploy/assemble.py "$RUNNER_TEMP/site-data/site-2000.zip" _site
      - name: Validate corrected manuscript results
        run: python3 tests/scientific-data.py _site
      - name: Validate basin search and coordinate lookup
        run: node tests/basin-lookup.cjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
